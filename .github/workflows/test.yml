# Checks on every push of a branch and every pull request (specs/004-releases);
# the release runs this workflow too, on the code of the tag.
name: test

on:
  push:
    branches: ["**"] # a tag is checked by the release
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "What to check: a branch, a tag or a commit"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Debian 12, the build environment of releases: glibc 2.36
    container: debian:bookworm
    steps:
      # git before checkout, so that it clones rather than downloads an archive
      - name: packages
        run: |
          apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # As in the release: without it git describe fails, and make builds in
      # "dev" as the version
      - name: safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: build dependencies
        run: scripts/debian-deps.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vet
      - run: make test
